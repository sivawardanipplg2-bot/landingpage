<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator</title>
    <link rel="stylesheet" href="kalkulator.css">
</head>
<body>

    <div class="container">
        <h1 class="judul">Kalkulator Nilai Rata-rata</h1>
        <p class="deskripsi">Masukkan tugas, UTS, dan UAS kamu</p>

        <label for="tugas">Nilai Tugas</label>
        <input type="number" id="tugas" placeholder="contoh: 85">

        <label for="uts">Nilai UTS</label>
        <input type="number" id="uts" placeholder="contoh: 78">

        <label for="uas">Nilai UAS</label>
        <input type="number" id="uas" placeholder="contoh: 88">
        
        <button id="hitung">Hitung nilai akhir</button>

        <div id="hasil" class="hasil">
            Hitung Nilai Akhir
        </div>
    <script src="kalkulator.js"></script>
</body>
</html>
