<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooth Scroll Navbar</title>
    <!-- Hubungkan ke file CSS Anda -->
    <link rel="stylesheet" href="contoh.css"> 
    <!-- Font Awesome untuk ikon bars jika diperlukan -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>

    <nav>
        <div class="menu">
            <!-- PENTING: href harus sama dengan id section memakai tanda pagar (#) -->
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
            <a href="#feedback">Feedback</a>

            <label for="check" class="btn bars">
                <i class="fa-solid fa-bars"></i>
            </label>
        </div>
    </nav>

    <!-- Struktur Section Anda -->
    <section id="home">
        <h1>Home</h1>
    </section>

    <section id="about">
        <h1>About</h1>
    </section>

    <section id="services">
        <h1>Services</h1>
    </section>

    <section id="contact">
        <h1>Contact</h1>
    </section>

    <section id="feedback">
        <h1>Feedback</h1>
    </section>

</body>
</html>
